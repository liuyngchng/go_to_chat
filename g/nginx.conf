# ============================================================
# kb-chat-flow nginx 反向代理配置
#
# 部署拓扑假设（2 节点）：
#   10.0.0.1:19007  role=admin  （管理面 + 文件处理 worker）
#   10.0.0.2:19007  role=chat   （用户聊天面）
#
# 如果两台都是 role=all，把下面两个 upstream 指向相同的机器即可。
# ============================================================

# --- 管理面节点（仅处理 /admin/* 页面 + 管理员写 API） ---
upstream admin_backend {
    server 10.0.0.1:19007 max_fails=2 fail_timeout=15s;
    # server 10.0.0.3:19007 max_fails=2 fail_timeout=15s;  # 扩容时加这里
}

# --- 用户聊天面节点（处理聊天 API + 页面 + 共享读 API） ---
upstream chat_backend {
    # sticky: 同一客户端 IP 始终打到同一台机器
    # 原因：/api/chat 是 SSE 长连接流式响应，中途切换节点会断流
    ip_hash;

    server 10.0.0.2:19007 max_fails=2 fail_timeout=15s;
    # server 10.0.0.4:19007 max_fails=2 fail_timeout=15s;  # 扩容时加这里
}

server {
    listen 80;
    server_name _;

    # 上传文件大小限制（知识库文档上传）
    client_max_body_size 100m;

    # ============================================================
    # 管理面路由 → admin_backend
    # ============================================================

    # 管理页面
    location /admin/ {
        proxy_pass http://admin_backend;
        include conf.d/proxy-common.conf;
    }

    # 管理员写 API（按路径显式路由，因为和共享 API 同在 /api/ 下）
    location /api/config {
        # GET → 任意节点都行；PUT → 只有 admin 节点有，所以统一走 admin
        proxy_pass http://admin_backend;
        include conf.d/proxy-common.conf;
    }

    location /api/vdb {
        # POST/PUT/DELETE 仅 admin；GET 共享但统一走 admin 也没问题
        proxy_pass http://admin_backend;
        include conf.d/proxy-common.conf;
    }

    location /api/faq {
        # POST/PUT/DELETE 仅 admin；GET 共享
        proxy_pass http://admin_backend;
        include conf.d/proxy-common.conf;
    }

    location /api/users {
        proxy_pass http://admin_backend;
        include conf.d/proxy-common.conf;
    }

    location /api/workflows {
        # POST/PUT/DELETE 仅 admin；GET 共享
        proxy_pass http://admin_backend;
        include conf.d/proxy-common.conf;
    }

    # ============================================================
    # 用户聊天面路由 → chat_backend
    # ============================================================

    # 聊天 SSE 流式接口（核心：需要关缓冲 + sticky）
    location /api/chat {
        proxy_pass http://chat_backend;
        include conf.d/proxy-common.conf;

        # SSE 关键：关闭缓冲，否则流式响应被 nginx 攒着不发
        proxy_buffering off;
        proxy_cache off;

        # 长连接超时（SSE 可能持续很久）
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 聊天同步接口
    location /api/chat/ {
        proxy_pass http://chat_backend;
        include conf.d/proxy-common.conf;
    }

    # AI Agent 写操作（仅 chat 角色有）
    location /api/ai-agents {
        proxy_pass http://chat_backend;
        include conf.d/proxy-common.conf;
    }

    # 聊天页面（根路径）
    location / {
        proxy_pass http://chat_backend;
        include conf.d/proxy-common.conf;
    }

    # 用户 API 文档页
    location /user/ {
        proxy_pass http://chat_backend;
        include conf.d/proxy-common.conf;
    }

    # ============================================================
    # 共享路由（所有角色都有）—— 放 chat_backend 即可
    # 以下 /api/* 路径会被上面的 admin 专用 location 先匹配，
    # 匹配不到的（如 /api/login, /api/me, /api/agents 等）走 chat
    # ============================================================

    location /api/ {
        proxy_pass http://chat_backend;
        include conf.d/proxy-common.conf;
    }

    # ============================================================
    # 健康检查（免认证，所有节点都有）
    # nginx 开源版不做主动探测，这是给外部监控用的
    # ============================================================
    location /health {
        proxy_pass http://chat_backend;
        include conf.d/proxy-common.conf;
    }
}
