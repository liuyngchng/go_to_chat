<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/lib/font-awesome.all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <title>系统管理 - {{.sys_name}}</title>
    <style>
        .cfg-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .cfg-sidebar {
            width: 200px;
            background: linear-gradient(180deg, #f8f9fb 0%, #eef1f6 100%);
            border-right: 1px solid #e0e3e8;
            padding: 16px 0;
            flex-shrink: 0;
        }

        .cfg-tab {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 20px;
            cursor: pointer;
            font-size: 0.95rem;
            color: #555;
            border-left: 3px solid transparent;
            transition: all 0.2s;
            font-weight: 500;
        }

        .cfg-tab:hover {
            background: rgba(75, 108, 183, 0.06);
            color: #333;
        }

        .cfg-tab.active {
            background: rgba(75, 108, 183, 0.1);
            color: #4b6cb7;
            border-left-color: #4b6cb7;
            font-weight: 600;
        }

        .cfg-tab i {
            width: 18px;
            text-align: center;
            font-size: 0.95rem;
        }

        .cfg-sidebar-divider {
            margin: 8px 16px;
            border-top: 1px solid #dce2ec;
        }

        .cfg-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px;
            background: #fff;
        }

        .cfg-section {
            display: none;
        }

        .cfg-section.active {
            display: block;
        }

        .cfg-section h2 {
            font-size: 1.25rem;
            color: #2c3e50;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 2px solid #eef1f6;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cfg-section h2 i {
            color: #4b6cb7;
        }

        .cfg-form-group {
            margin-bottom: 20px;
        }

        .cfg-form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: #444;
            margin-bottom: 6px;
        }

        .cfg-form-group label .cfg-hint {
            font-weight: 400;
            color: #999;
            font-size: 0.82rem;
        }

        .cfg-form-group input[type="text"],
        .cfg-form-group input[type="password"],
        .cfg-form-group input[type="number"],
        .cfg-form-group textarea,
        .cfg-form-group select {
            width: 100%;
            max-width: 560px;
            padding: 10px 14px;
            border: 2px solid #e0e3e8;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: border-color 0.2s;
            font-family: inherit;
        }

        .cfg-form-group input:focus,
        .cfg-form-group textarea:focus,
        .cfg-form-group select:focus {
            outline: none;
            border-color: #4b6cb7;
            box-shadow: 0 0 0 3px rgba(75, 108, 183, 0.12);
        }

        .cfg-form-group textarea {
            max-width: 720px;
            min-height: 280px;
            font-family: 'SF Mono', 'Consolas', 'Monaco', monospace;
            font-size: 0.85rem;
            line-height: 1.6;
            resize: vertical;
        }

        .cfg-toggle-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .cfg-toggle {
            position: relative;
            width: 48px;
            height: 26px;
            cursor: pointer;
        }

        .cfg-toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .cfg-toggle-slider {
            position: absolute;
            inset: 0;
            background: #ccc;
            border-radius: 26px;
            transition: all 0.3s;
        }

        .cfg-toggle-slider::before {
            content: '';
            position: absolute;
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background: white;
            border-radius: 50%;
            transition: all 0.3s;
        }

        .cfg-toggle input:checked + .cfg-toggle-slider {
            background: #4b6cb7;
        }

        .cfg-toggle input:checked + .cfg-toggle-slider::before {
            transform: translateX(22px);
        }

        .cfg-toggle-label {
            font-size: 0.9rem;
            color: #555;
        }

        .cfg-actions {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 12px;
        }

        .cfg-btn {
            padding: 11px 28px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cfg-btn-save {
            background: linear-gradient(135deg, #4b6cb7, #3a5a9e);
            color: white;
        }

        .cfg-btn-save:hover {
            background: linear-gradient(135deg, #3a5a9e, #2c487e);
            box-shadow: 0 4px 12px rgba(75, 108, 183, 0.3);
            transform: translateY(-1px);
        }

        .cfg-btn-reset {
            background: #f0f0f0;
            color: #555;
        }

        .cfg-btn-reset:hover {
            background: #e0e0e0;
        }

        .cfg-toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 14px 24px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            font-size: 0.9rem;
            z-index: 9999;
            display: none;
            animation: cfgToastIn 0.3s ease-out;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

        .cfg-toast.success { background: #2e7d32; }
        .cfg-toast.error { background: #c62828; }

        @keyframes cfgToastIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* KB iframe */
        .cfg-iframe-wrap {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .cfg-iframe-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            background: #f8f9fb;
            border: 1px solid #e0e3e8;
            border-bottom: none;
            border-radius: 8px 8px 0 0;
            font-size: 0.85rem;
            color: #666;
        }

        .cfg-iframe-header a {
            margin-left: auto;
            color: #4b6cb7;
            text-decoration: none;
            font-size: 0.82rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .cfg-iframe-header a:hover { text-decoration: underline; }

        .cfg-iframe {
            flex: 1;
            border: 1px solid #e0e3e8;
            border-radius: 0 0 8px 8px;
            min-height: 1000px;
            background: #fff;
        }

        .cfg-desc-block {
            background: #f8f9fb;
            border: 1px solid #e8eaed;
            border-radius: 8px;
            padding: 16px 20px;
            margin-top: 24px;
            font-size: 0.85rem;
            color: #666;
            line-height: 1.6;
            max-width: 560px;
        }

        .cfg-desc-block code {
            background: #e8ecf2;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.82rem;
            color: #4b6cb7;
        }

        @media (max-width: 768px) {
            .cfg-layout { flex-direction: column; }
            .cfg-sidebar {
                width: 100%;
                flex-direction: row;
                display: flex;
                padding: 8px;
                overflow-x: auto;
                border-right: none;
                border-bottom: 1px solid #e0e3e8;
            }
            .cfg-tab {
                border-left: none;
                border-bottom: 3px solid transparent;
                white-space: nowrap;
                padding: 10px 16px;
            }
            .cfg-tab.active {
                border-left-color: transparent;
                border-bottom-color: #4b6cb7;
            }
            .cfg-content { padding: 20px 16px; }
            .cfg-form-group input,
            .cfg-form-group textarea,
            .cfg-form-group select { max-width: 100%; }
            .cfg-iframe { min-height: 800px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-cog"></i> 系统管理</h1>
        </header>

        <div class="cfg-layout">
            <!-- 左侧导航 -->
            <nav class="cfg-sidebar">
                <div class="cfg-tab active" data-tab="kbmgmt">
                    <i class="fas fa-database"></i> 知识库管理
                </div>
                <div class="cfg-sidebar-divider"></div>
                <div class="cfg-tab" data-tab="kb">
                    <i class="fas fa-book"></i> 文本处理配置
                </div>
                <div class="cfg-tab" data-tab="llm">
                    <i class="fas fa-robot"></i> 大模型配置
                </div>
                <div class="cfg-tab" data-tab="sys">
                    <i class="fas fa-sliders-h"></i> 系统配置
                </div>
                <div class="cfg-sidebar-divider"></div>
                <div class="cfg-tab" data-tab="users">
                    <i class="fas fa-users"></i> 用户管理
                </div>
                <div class="cfg-tab" data-tab="agents">
                    <i class="fas fa-headset"></i> 客服座席
                </div>
            </nav>

            <!-- 右侧内容区 -->
            <div class="cfg-content">
                <!-- 知识库管理（iframe 嵌入） -->
                <div class="cfg-section active" id="section-kbmgmt">
                    <div class="cfg-iframe-wrap">
                        <div class="cfg-iframe-header">
                            <i class="fas fa-database"></i> 知识库管理
                            <a href="/vdb/idx?t={{.token}}" target="_blank">
                                <i class="fas fa-external-link-alt"></i> 新窗口打开
                            </a>
                        </div>
                        <iframe class="cfg-iframe" id="kbmgmtIframe"
                                src="/vdb/idx?t={{.token}}">
                        </iframe>
                    </div>
                </div>

                <!-- 文本处理配置 -->
                <div class="cfg-section" id="section-kb">
                    <h2><i class="fas fa-book"></i> 文本处理配置</h2>

                    <h3 style="font-size:1rem;color:#4b6cb7;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid #eef1f6;">
                        <i class="fas fa-sliders-h"></i> 检索与分片参数
                    </h3>

                    <div style="display:flex;gap:16px;flex-wrap:wrap;">
                        <div class="cfg-form-group" style="flex:1;min-width:200px;">
                            <label>文本分片大小 <span class="cfg-hint">(字符数)</span></label>
                            <input type="number" id="kb_chunk_size" min="50" max="2000" placeholder="300">
                        </div>
                        <div class="cfg-form-group" style="flex:1;min-width:200px;">
                            <label>分片重叠大小 <span class="cfg-hint">(字符数)</span></label>
                            <input type="number" id="kb_chunk_overlap" min="0" max="500" placeholder="80">
                        </div>
                    </div>
                    <div style="display:flex;gap:16px;flex-wrap:wrap;">
                        <div class="cfg-form-group" style="flex:1;min-width:200px;">
                            <label>检索返回条数</label>
                            <input type="number" id="kb_top_k" min="1" max="50" placeholder="3">
                        </div>
                        <div class="cfg-form-group" style="flex:1;min-width:200px;">
                            <label>相似度阈值 <span class="cfg-hint">(0~1)</span></label>
                            <input type="number" id="kb_score_threshold" min="0" max="1" step="0.01" placeholder="0.1">
                        </div>
                    </div>

                    <div class="cfg-actions">
                        <button class="cfg-btn cfg-btn-save" onclick="saveKBConfig()">
                            <i class="fas fa-check"></i> 保存知识库参数
                        </button>
                        <button class="cfg-btn cfg-btn-reset" onclick="loadConfig()">
                            <i class="fas fa-undo"></i> 重置
                        </button>
                    </div>
                </div>

                <!-- 大模型配置 -->
                <div class="cfg-section" id="section-llm">
                    <h2><i class="fas fa-robot"></i> 大模型配置</h2>

                    <h3 style="font-size:1rem;color:#4b6cb7;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid #eef1f6;">
                        <i class="fas fa-comments"></i> LLM 对话模型
                    </h3>

                    <div class="cfg-form-group">
                        <label>API 地址 <span class="cfg-hint">(OpenAI 兼容接口)</span></label>
                        <input type="text" id="llm_api_uri" placeholder="https://api.example.com/v1">
                    </div>
                    <div class="cfg-form-group">
                        <label>API Key</label>
                        <input type="password" id="llm_api_key" placeholder="sk-xxx">
                    </div>
                    <div class="cfg-form-group">
                        <label>模型名称</label>
                        <input type="text" id="llm_model_name" placeholder="qwen3.7-plus">
                    </div>

                    <h3 style="font-size:1rem;color:#4b6cb7;margin:28px 0 16px;padding-bottom:8px;border-bottom:1px solid #eef1f6;">
                        <i class="fas fa-cubes"></i> Embedding 向量模型
                    </h3>

                    <div class="cfg-form-group">
                        <label>API 地址 <span class="cfg-hint">(OpenAI 兼容接口)</span></label>
                        <input type="text" id="embedding_api_uri" placeholder="https://api.example.com/v1">
                    </div>
                    <div class="cfg-form-group">
                        <label>API Key</label>
                        <input type="password" id="embedding_api_key" placeholder="sk-xxx">
                    </div>
                    <div class="cfg-form-group">
                        <label>模型名称</label>
                        <input type="text" id="embedding_model_name" placeholder="text-embedding-3-small">
                    </div>

                    <h3 style="font-size:1rem;color:#4b6cb7;margin:28px 0 16px;padding-bottom:8px;border-bottom:1px solid #eef1f6;">
                        <i class="fas fa-microchip"></i> LLM 模型参数
                    </h3>

                    <div style="display:flex;gap:16px;flex-wrap:wrap;">
                        <div class="cfg-form-group" style="flex:1;min-width:180px;">
                            <label>Temperature <span class="cfg-hint">(0~2)</span></label>
                            <input type="number" id="llm_temperature" min="0" max="2" step="0.1" placeholder="0.7">
                        </div>
                        <div class="cfg-form-group" style="flex:1;min-width:180px;">
                            <label>Top-P <span class="cfg-hint">(0~1)</span></label>
                            <input type="number" id="llm_top_p" min="0" max="1" step="0.01" placeholder="0.9">
                        </div>
                        <div class="cfg-form-group" style="flex:1;min-width:180px;">
                            <label>Max Tokens</label>
                            <input type="number" id="llm_max_tokens" min="1" max="32768" placeholder="2048">
                        </div>
                    </div>

                    <div class="cfg-actions">
                        <button class="cfg-btn cfg-btn-save" onclick="saveLLMConfig()">
                            <i class="fas fa-check"></i> 保存大模型配置
                        </button>
                        <button class="cfg-btn cfg-btn-reset" onclick="loadConfig()">
                            <i class="fas fa-undo"></i> 重置
                        </button>
                    </div>
                </div>

                <!-- 系统配置 -->
                <div class="cfg-section" id="section-sys">
                    <h2><i class="fas fa-sliders-h"></i> 系统配置</h2>

                    <div class="cfg-form-group">
                        <label>系统名称</label>
                        <input type="text" id="sys_name" placeholder="对话机器人" maxlength="50">
                    </div>

                    <div class="cfg-form-group">
                        <label>用户认证</label>
                        <div class="cfg-toggle-row">
                            <label class="cfg-toggle">
                                <input type="checkbox" id="sys_auth">
                                <span class="cfg-toggle-slider"></span>
                            </label>
                            <span class="cfg-toggle-label" id="authLabel">未启用</span>
                        </div>
                    </div>

                    <div class="cfg-form-group">
                        <label>接口认证</label>
                        <div class="cfg-toggle-row">
                            <label class="cfg-toggle">
                                <input type="checkbox" id="sys_api_auth">
                                <span class="cfg-toggle-slider"></span>
                            </label>
                            <span class="cfg-toggle-label" id="apiAuthLabel">未启用</span>
                        </div>
                    </div>

                    <div class="cfg-form-group" style="margin-top:28px;">
                        <label>
                            聊天提示词模板
                            <span class="cfg-hint">
                                — 可用变量: <code>{'{context}'}</code> <code>{'{history}'}</code> <code>{'{question}'}</code> <code>{'{cur_date}'}</code> <code>{'{cur_week}'}</code>
                            </span>
                        </label>
                        <textarea id="chat_msg" placeholder="输入提示词模板..."></textarea>
                    </div>

                    <div class="cfg-actions">
                        <button class="cfg-btn cfg-btn-save" onclick="saveSysConfig()">
                            <i class="fas fa-check"></i> 保存系统配置
                        </button>
                        <button class="cfg-btn cfg-btn-reset" onclick="loadConfig()">
                            <i class="fas fa-undo"></i> 重置
                        </button>
                    </div>
                </div>

                <!-- 用户管理 -->
                <div class="cfg-section" id="section-users">
                    <h2><i class="fas fa-users"></i> 用户管理</h2>

                    <div style="display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;align-items:flex-end;">
                        <div class="cfg-form-group" style="margin-bottom:0;flex:1;min-width:140px;">
                            <label>用户名</label>
                            <input type="text" id="newUserName" placeholder="用户名" style="max-width:200px;">
                        </div>
                        <div class="cfg-form-group" style="margin-bottom:0;flex:1;min-width:140px;">
                            <label>密码</label>
                            <input type="password" id="newUserPwd" placeholder="密码" style="max-width:200px;">
                        </div>
                        <div class="cfg-form-group" style="margin-bottom:0;">
                            <label>角色</label>
                            <select id="newUserRole" style="max-width:150px;padding:10px 14px;border:2px solid #e0e3e8;border-radius:8px;font-size:0.9rem;">
                                <option value="0">普通用户</option>
                                <option value="1">管理员</option>
                                <option value="2">客服座席</option>
                                <option value="3">API用户</option>
                            </select>
                        </div>
                        <div class="cfg-form-group" style="margin-bottom:0;flex:2;min-width:180px;">
                            <label>备注</label>
                            <input type="text" id="newUserNote" placeholder="备注" style="max-width:260px;">
                        </div>
                        <button class="cfg-btn cfg-btn-save btn-sm" onclick="addUser()">
                            <i class="fas fa-plus"></i> 添加用户
                        </button>
                    </div>

                    <table class="result-table" style="max-width:900px;">
                        <thead><tr><th>用户名</th><th>角色</th><th>备注</th><th>操作</th></tr></thead>
                        <tbody id="usersTbody"><tr><td colspan="4" style="text-align:center;color:#999;">加载中...</td></tr></tbody>
                    </table>
                </div>

                <!-- 客服座席 -->
                <div class="cfg-section" id="section-agents">
                    <h2><i class="fas fa-headset"></i> 在线客服座席</h2>

                    <table class="result-table" id="agentsTable" style="max-width:700px;">
                        <thead>
                            <tr>
                                <th>用户名</th>
                                <th>登录时间</th>
                                <th>备注</th>
                            </tr>
                        </thead>
                        <tbody id="agentsTbody">
                            <tr>
                                <td colspan="3" style="text-align:center;color:#999;padding:40px;">
                                    <i class="fas fa-spinner fa-pulse"></i> 加载中...
                                </td>
                            </tr>
                        </tbody>
                    </table>

                    <div class="cfg-actions">
                        <button class="cfg-btn cfg-btn-reset" onclick="loadAgents()">
                            <i class="fas fa-sync-alt"></i> 刷新
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <footer>
            <p>{{.sys_name}} - 系统管理</p>
        </footer>
    </div>

    <!-- Toast -->
    <div id="cfgToast" class="cfg-toast"></div>

    <script>
        // 从 URL 参数 t 提取 token 并持久化
        (function() {
            var params = new URLSearchParams(window.location.search);
            var t = params.get('t');
            if (t) {
                localStorage.setItem('token', t);
            }
        })();

        function getToken() {
            return localStorage.getItem('token') || '';
        }
        function authFetch(url, options) {
            options = options || {};
            options.headers = options.headers || {};
            options.headers['Authorization'] = 'Bearer ' + getToken();
            return fetch(url, options);
        }

        // ============================================================
        // Tab 切换
        // ============================================================
        document.querySelectorAll('.cfg-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.cfg-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.cfg-section').forEach(s => s.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById('section-' + tab.dataset.tab).classList.add('active');
            });
        });

        // Auth 开关标签
        document.getElementById('sys_auth').addEventListener('change', function() {
            document.getElementById('authLabel').textContent = this.checked ? '已启用' : '未启用';
        });
        document.getElementById('sys_api_auth').addEventListener('change', function() {
            document.getElementById('apiAuthLabel').textContent = this.checked ? '已启用' : '未启用';
        });

        // ============================================================
        // 加载配置
        // ============================================================
        async function loadConfig() {
            try {
                const resp = await authFetch('/api/config');
                const json = await resp.json();
                const data = json.data;

                // 系统配置
                document.getElementById('sys_name').value = data.sys.name || '';
                const auth = data.sys.auth === 'true';
                document.getElementById('sys_auth').checked = auth;
                document.getElementById('authLabel').textContent = auth ? '已启用' : '未启用';
                const apiAuth = data.sys.api_auth !== 'false'; // 默认启用
                document.getElementById('sys_api_auth').checked = apiAuth;
                document.getElementById('apiAuthLabel').textContent = apiAuth ? '已启用' : '未启用';

                // 大模型配置
                document.getElementById('llm_api_uri').value = data.api.llm_api_uri || '';
                document.getElementById('llm_api_key').value = data.api.llm_api_key || '';
                document.getElementById('llm_model_name').value = data.api.llm_model_name || '';
                document.getElementById('embedding_api_uri').value = data.api.embedding_api_uri || '';
                document.getElementById('embedding_api_key').value = data.api.embedding_api_key || '';
                document.getElementById('embedding_model_name').value = data.api.embedding_model_name || '';

                // 提示词
                document.getElementById('chat_msg').value = data.prompt.chat_msg || '';

                // 知识库参数
                document.getElementById('kb_chunk_size').value = data.kb.chunk_size || 300;
                document.getElementById('kb_chunk_overlap').value = data.kb.chunk_overlap || 80;
                document.getElementById('kb_top_k').value = data.kb.top_k || 3;
                document.getElementById('kb_score_threshold').value = data.kb.score_threshold || 0.1;

                // LLM 参数
                document.getElementById('llm_temperature').value = data.llm.temperature || 0.7;
                document.getElementById('llm_top_p').value = data.llm.top_p || 0.9;
                document.getElementById('llm_max_tokens').value = data.llm.max_tokens || 2048;
            } catch (err) {
                showToast('加载配置失败: ' + err.message, 'error');
            }
        }

        // ============================================================
        // 保存大模型配置
        // ============================================================
        async function saveLLMConfig() {
            const payload = {
                sys: { name: '', auth: '' },
                api: {
                    llm_api_uri: document.getElementById('llm_api_uri').value.trim(),
                    llm_api_key: document.getElementById('llm_api_key').value.trim(),
                    llm_model_name: document.getElementById('llm_model_name').value.trim(),
                    embedding_api_uri: document.getElementById('embedding_api_uri').value.trim(),
                    embedding_api_key: document.getElementById('embedding_api_key').value.trim(),
                    embedding_model_name: document.getElementById('embedding_model_name').value.trim()
                },
                prompt: { chat_msg: '' },
                kb: { chunk_size: 0, chunk_overlap: 0, top_k: 0, score_threshold: 0 },
                llm: {
                    temperature: parseFloat(document.getElementById('llm_temperature').value) || 0,
                    top_p: parseFloat(document.getElementById('llm_top_p').value) || 0,
                    max_tokens: parseInt(document.getElementById('llm_max_tokens').value) || 0
                }
            };

            try {
                const resp = await authFetch('/api/config', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const json = await resp.json();
                if (json.status === 'ok') {
                    showToast('大模型配置已保存', 'success');
                } else {
                    showToast('保存失败: ' + (json.error || '未知错误'), 'error');
                }
            } catch (err) {
                showToast('保存失败: ' + err.message, 'error');
            }
        }

        // ============================================================
        // 保存知识库参数
        // ============================================================
        async function saveKBConfig() {
            const payload = {
                sys: { name: '', auth: '' },
                api: {
                    llm_api_uri: '', llm_api_key: '', llm_model_name: '',
                    embedding_api_uri: '', embedding_api_key: '', embedding_model_name: ''
                },
                prompt: { chat_msg: '' },
                kb: {
                    chunk_size: parseInt(document.getElementById('kb_chunk_size').value) || 0,
                    chunk_overlap: parseInt(document.getElementById('kb_chunk_overlap').value) || 0,
                    top_k: parseInt(document.getElementById('kb_top_k').value) || 0,
                    score_threshold: parseFloat(document.getElementById('kb_score_threshold').value) || 0
                },
                llm: { temperature: 0, top_p: 0, max_tokens: 0 }
            };

            try {
                const resp = await authFetch('/api/config', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const json = await resp.json();
                if (json.status === 'ok') {
                    showToast('知识库参数已保存', 'success');
                } else {
                    showToast('保存失败: ' + (json.error || '未知错误'), 'error');
                }
            } catch (err) {
                showToast('保存失败: ' + err.message, 'error');
            }
        }

        // ============================================================
        // 保存系统配置
        // ============================================================
        async function saveSysConfig() {
            const payload = {
                sys: {
                    name: document.getElementById('sys_name').value.trim(),
                    auth: document.getElementById('sys_auth').checked ? 'true' : 'false',
                    api_auth: document.getElementById('sys_api_auth').checked ? 'true' : 'false'
                },
                api: {
                    llm_api_uri: '', llm_api_key: '', llm_model_name: '',
                    embedding_api_uri: '', embedding_api_key: '', embedding_model_name: ''
                },
                prompt: {
                    chat_msg: document.getElementById('chat_msg').value
                },
                kb: { chunk_size: 0, chunk_overlap: 0, top_k: 0, score_threshold: 0 },
                llm: { temperature: 0, top_p: 0, max_tokens: 0 }
            };

            try {
                const resp = await authFetch('/api/config', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const json = await resp.json();
                if (json.status === 'ok') {
                    showToast('系统配置已保存', 'success');
                } else {
                    showToast('保存失败: ' + (json.error || '未知错误'), 'error');
                }
            } catch (err) {
                showToast('保存失败: ' + err.message, 'error');
            }
        }

        // ============================================================
        // Toast 提示
        // ============================================================
        function showToast(msg, type) {
            const toast = document.getElementById('cfgToast');
            toast.textContent = msg;
            toast.className = 'cfg-toast ' + type;
            toast.style.display = 'block';
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        // ============================================================
        // 在线座席
        // ============================================================
        async function loadAgents() {
            try {
                const resp = await authFetch('/api/agents');
                const json = await resp.json();
                const agents = json.agents || [];
                const tbody = document.getElementById('agentsTbody');

                if (agents.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:#999;padding:40px;">暂无在线座席</td></tr>';
                    return;
                }

                tbody.innerHTML = agents.map(a => {
                    const roleLabel = '<span style="display:inline-block;padding:2px 8px;border-radius:4px;font-size:0.8rem;background:#e3f2fd;color:#1976d2;">座席</span>';
                    return `<tr>
                        <td><i class="fas fa-user-circle" style="color:#4b6cb7;"></i> ${a.user_name} ${roleLabel}</td>
                        <td>${a.login_time}</td>
                        <td>${a.note || '-'}</td>
                    </tr>`;
                }).join('');
            } catch (err) {
                document.getElementById('agentsTbody').innerHTML =
                    '<tr><td colspan="3" style="text-align:center;color:#c62828;padding:40px;">加载失败: ' + err.message + '</td></tr>';
            }
        }

        // ============================================================
        // 用户管理
        // ============================================================
        const ROLE_NAMES = {0:'普通用户', 1:'管理员', 2:'客服座席', 3:'API用户'};

        async function loadUsers() {
            try {
                const resp = await authFetch('/api/users');
                const data = await resp.json();
                const users = data.data || [];
                document.getElementById('usersTbody').innerHTML = users.map(u =>
                    `<tr>
                        <td><i class="fas fa-user-circle" style="color:#4b6cb7;"></i> ${escHtml2(u.user_name)}</td>
                        <td>${ROLE_NAMES[u.role] || u.role}</td>
                        <td>${escHtml2(u.note)}</td>
                        <td>
                            <button class="cfg-btn cfg-btn-reset" style="padding:4px 12px;font-size:0.8rem;" onclick="resetPwd('${escHtml2(u.user_name)}')"><i class="fas fa-redo"></i> 重置密码</button>
                            <button class="cfg-btn cfg-btn-reset" style="padding:4px 12px;font-size:0.8rem;color:#c62828;" onclick="delUser('${escHtml2(u.user_name)}')"><i class="fas fa-trash"></i> 删除</button>
                        </td>
                    </tr>`
                ).join('');
            } catch(e) { document.getElementById('usersTbody').innerHTML = '<tr><td colspan="4" style="color:#c62828;">加载失败</td></tr>'; }
        }

        async function addUser() {
            const userName = document.getElementById('newUserName').value.trim();
            const userPwd = document.getElementById('newUserPwd').value.trim();
            const role = parseInt(document.getElementById('newUserRole').value);
            const note = document.getElementById('newUserNote').value.trim();
            if (!userName || !userPwd) { alert('用户名和密码不能为空'); return; }
            try {
                const resp = await authFetch('/api/users', {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({user_name:userName, user_pwd:userPwd, role, note})
                });
                const data = await resp.json();
                if (data.status === 'ok') {
                    document.getElementById('newUserName').value = '';
                    document.getElementById('newUserPwd').value = '';
                    document.getElementById('newUserNote').value = '';
                    loadUsers();
                } else { alert(data.error || '添加失败'); }
            } catch(e) { alert('网络错误: '+e.message); }
        }

        async function delUser(name) {
            if (!confirm('确定删除用户 "' + name + '" 吗？')) return;
            try {
                const resp = await authFetch('/api/users/' + encodeURIComponent(name), { method: 'DELETE' });
                const data = await resp.json();
                if (data.status === 'ok') loadUsers();
                else alert(data.error || '删除失败');
            } catch(e) { alert('网络错误: '+e.message); }
        }

        async function resetPwd(name) {
            const pwd = prompt('输入用户 "' + name + '" 的新密码：');
            if (!pwd) return;
            try {
                const resp = await authFetch('/api/users/' + encodeURIComponent(name) + '/reset-pwd', {
                    method: 'PUT',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({user_pwd: pwd})
                });
                const data = await resp.json();
                if (data.status === 'ok') alert('密码已重置');
                else alert(data.error || '重置失败');
            } catch(e) { alert('网络错误: '+e.message); }
        }

        function escHtml2(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

        // 初始加载
        loadConfig();
        loadUsers();
    </script>
</body>
</html>
