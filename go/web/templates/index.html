<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/static/lib/purify.min.js"></script>
    <script src="/static/lib/marked.min.js"></script>
    <link rel="stylesheet" href="/static/lib/font-awesome.all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <title>{{.sys_name}}</title>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-headset"></i> {{.sys_name}}</h1>
            <div class="system-settings-link-container">
                <button id="newChat" class="btn-clear" title="新对话">
                    <i class="fas fa-plus-circle"></i> 新对话
                </button>
                <a href="/admin/config?uid={{.uid}}&app_source={{.app_source}}" class="system-settings-link" target="_blank">
                    <i class="fas fa-cog"></i> 配置
                </a>
            </div>
        </header>

        <div class="chat-container" id="chat-container">
        </div>

        <form id="query-form">
            <div class="input-container">
                <input type="text" class="input-field" id="query-input" name="msg"
                       placeholder="请输入您的问题..." required autocomplete="off">
                <div class="button-container">
                    <button type="submit" class="send-button" id="send-button">
                        <i class="fas fa-paper-plane"></i> 发送
                    </button>
                    <button type="button" class="stop-button" id="stop-button" style="display:none;">
                        <i class="fas fa-stop"></i> 停止
                    </button>
                </div>
            </div>
            <input type="hidden" id="uid" name="uid" value="{{.uid}}">
            <input type="hidden" id="app_source" name="app_source" value="{{.app_source}}">
        </form>
    </div>
    <script src="/static/js/app.js"></script>
</body>
</html>
